name: Wire Apple Music UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire Apple Music authorization
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/routes/+page.svelte')
          text = path.read_text(encoding='utf-8')
          old_import = """  import {\n    completeSpotifyLoginFromUrl,\n    disconnectSpotify,\n    startSpotifyLogin\n  } from '$lib/music/providers/spotify';"""
          new_import = """  import {\n    completeSpotifyLoginFromUrl,\n    disconnectSpotify,\n    startSpotifyLogin\n  } from '$lib/music/providers/spotify';\n  import { connectAppleMusic, disconnectAppleMusic } from '$lib/music/providers/appleMusic';"""
          if old_import not in text:
              raise SystemExit('Spotify import block not found')
          text = text.replace(old_import, new_import, 1)

          old_connect = """  async function connectProvider(status: ProviderStatus) {\n    try {\n      if (status.id === 'spotify') {\n        await startSpotifyLogin();\n        return;\n      }\n\n      pushToast(`${status.name}: ${status.message}`, 'info');\n    } catch (error: unknown) {\n      pushToast(getErrorMessage(error), 'error');\n    }\n  }\n\n  function disconnectProvider(status: ProviderStatus) {\n    if (status.id === 'spotify') {\n      disconnectSpotify();\n      providerStatuses = getProviderStatuses();\n      pushToast('Spotify disconnected.', 'info');\n    }\n  }"""
          new_connect = """  async function connectProvider(status: ProviderStatus) {\n    try {\n      if (status.id === 'spotify') {\n        await startSpotifyLogin();\n        return;\n      }\n\n      if (status.id === 'appleMusic') {\n        const connected = await connectAppleMusic();\n        providerStatuses = getProviderStatuses();\n        pushToast(connected.message, 'success');\n        void loadDiscoveryShelves();\n        return;\n      }\n\n      pushToast(`${status.name}: ${status.message}`, 'info');\n    } catch (error: unknown) {\n      pushToast(getErrorMessage(error), 'error');\n      providerStatuses = getProviderStatuses();\n    }\n  }\n\n  async function disconnectProvider(status: ProviderStatus) {\n    if (status.id === 'spotify') {\n      disconnectSpotify();\n      providerStatuses = getProviderStatuses();\n      pushToast('Spotify disconnected.', 'info');\n      return;\n    }\n\n    if (status.id === 'appleMusic') {\n      await disconnectAppleMusic();\n      providerStatuses = getProviderStatuses();\n      pushToast('Apple Music disconnected.', 'info');\n    }\n  }"""
          if old_connect not in text:
              raise SystemExit('provider connection block not found')
          text = text.replace(old_connect, new_connect, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit UI wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/+page.svelte
          git diff --cached --quiet || git commit -m "feat: connect Apple Music from settings"
          git push
